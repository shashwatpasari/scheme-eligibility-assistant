[project]
name = "scheme-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shashwatpasari", email = "shashwatpasari@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flagembedding>=1.4.2",
    "google-genai>=2.33.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
]

[project.scripts]
scheme-assistant = "scheme_assistant:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errors, unused code, import order, modern syntax, common bugs
ignore = ["B905"]   # don't require zip(..., strict=...); plain zip() is easier to read

[tool.pytest.ini_options]
testpaths = ["tests"]
